# Porta fixa. No Azure usamos tambem a configuracao WEBSITES_PORT=8080.
server.port=8080

# Conexao com o SQL Server. Os valores vem de VARIAVEIS DE AMBIENTE
# (no Azure sao as "App settings" do Web App; o script deploy.ps1 configura).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# O JPA NAO cria tabelas: elas sao criadas pelo schema.sql (DDL) abaixo.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Executa o schema.sql na subida (so cria se as tabelas ainda nao existirem).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
